/* A tiny, unhurried wiggle; transform keeps the layout still. */
button { transform-origin: center; transition: background-color 180ms ease, box-shadow 180ms ease; }
@keyframes quiet-wiggle {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-1.2deg); }
  40% { transform: rotate(1.2deg); }
  60% { transform: rotate(-0.7deg); }
  80% { transform: rotate(0.7deg); }
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  button:hover:not(:disabled) { animation: quiet-wiggle 1.4s ease-in-out infinite; }
  button:active:not(:disabled) { animation: none; transform: scale(0.98); }
}
@media (prefers-reduced-motion: reduce) {
  button { animation: none !important; transition: none; }
}
